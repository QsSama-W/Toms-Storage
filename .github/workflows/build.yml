name: 编译模组

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 配置 Java 17 环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 赋予 Gradle 执行权限
      run: chmod +x ./Toms-Storage-120/gradlew

    - name: 执行编译 (分配 3G 内存并强制刷新依赖网络缓存)
      env:
        GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
      run: cd Toms-Storage-120 && ./gradlew build --refresh-dependencies

    - name: 上传编译生成的 Jar 文件
      uses: actions/upload-artifact@v4
      with:
        name: Toms-Storage-1.20.1-Forge
        path: Toms-Storage-120/build/libs/*.jar
